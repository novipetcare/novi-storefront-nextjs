main = ".open-next/worker.js"
name = "novi-storefront-nextjs"
compatibility_date = "2026-07-30"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# OpenNext's default caching system uses these Durable Object classes.
# Cloudflare requires any exported Durable Object class to have an
# explicit migration declared — without this, the Worker isn't
# spec-compliant and can fail at runtime on every request.
[[durable_objects.bindings]]
name = "NEXT_CACHE_DO_QUEUE"
class_name = "DOQueueHandler"

[[durable_objects.bindings]]
name = "NEXT_TAG_CACHE_DO_SHARDED"
class_name = "DOShardedTagCache"

[[durable_objects.bindings]]
name = "NEXT_CACHE_DO_PURGE"
class_name = "BucketCachePurge"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DOQueueHandler", "DOShardedTagCache", "BucketCachePurge"]
